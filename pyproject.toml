[project]
name = "tgdl"
version = "0.2.0"
description = "多账号并行下载 Telegram 文件"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.36",
    "cryptg>=0.4",
    "qrcode>=7.4",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
tgdl = "tgdl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgdl"]
